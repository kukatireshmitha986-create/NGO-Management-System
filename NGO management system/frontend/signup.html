<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGO Signup</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: green;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="container">

    <h2>NGO Signup</h2>


    <input 
        type="text"
        id="name"
        placeholder="Enter Name"
    >


    <input 
        type="email"
        id="email"
        placeholder="Enter Email"
    >


    <input 
        type="password"
        id="password"
        placeholder="Enter Password"
    >


    <button onclick="signup()">
        Signup
    </button>


    <p id="message"></p>


    <a href="login.html">
        Already have an account? Login
    </a>


</div>



<script>


async function signup(){


    const name = document.getElementById("name").value;

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;



    if(name === "" || email === "" || password === ""){

        document.getElementById("message").innerHTML =
        "Please fill all fields";

        return;

    }


    try {


        const response = await fetch(
            "http://127.0.0.1:5000/api/auth/signup",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    email: email,
                    password: password

                })

            }
        );


        const data = await response.json();


        document.getElementById("message").innerHTML =
        data.message;



        if(data.message === "Signup successful"){


            setTimeout(()=>{

                window.location.href = "login.html";

            },1000);


        }


    }
    catch(error){


        console.log(error);


        document.getElementById("message").innerHTML =
        "Backend connection failed";


    }


}


</script>


</body>

</html>
