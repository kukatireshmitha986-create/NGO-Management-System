<!-- Donation Section -->


<section class="donation-section">


<h1>
    Support Our Mission
</h1>


<p>
    Your contribution helps us provide education,
    healthcare, food, and essential support to people
    in need.
</p>




<div class="donation-box">


<form id="donationForm">


<label>
    Full Name
</label>

<input 
type="text" 
id="name"
placeholder="Enter your name"
required>



<label>
    Email Address
</label>

<input 
type="email"
id="email"
placeholder="Enter your email"
required>




<label>
    Donation Amount
</label>


<input 
type="number"
id="amount"
placeholder="Enter amount"
required>




<label>
    Donation Purpose
</label>


<select id="purpose">

<option>
Education
</option>

<option>
Healthcare
</option>

<option>
Food Support
</option>

<option>
Community Development
</option>

</select>



<button type="submit">
Donate Now
</button>


</form>


</div>


</section>
