<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation Bar -->

<div class="navbar">

    <h2>NGO Management System</h2>

    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="donations.html">Donations</a></li>
        <li><a href="volunteers.html">Volunteers</a></li>
        <li><a href="beneficiaries.html">Beneficiaries</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="reports.html">Reports</a></li>
    </ul>

</div>

<div class="container">

    <h1>Volunteer Management</h1>

    <form id="volunteerForm">

        <label>Volunteer Name</label>
        <input type="text" id="volunteerName" placeholder="Enter Volunteer Name" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter Phone Number" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Email Address" required>

        <button type="submit">Add Volunteer</button>

    </form>

    <br>

    <input
        type="text"
        id="searchVolunteer"
        placeholder="Search Volunteer..."
        onkeyup="searchVolunteer()">

    <br><br>

    <h2>Volunteer List</h2>

    <table id="volunteerTable">

        <thead>

            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

    <br>

    <button onclick="window.location.href='dashboard.html'">
        ← Back to Dashboard
    </button>

</div>

<script src="js/volunteers.js"></script>

</body>
</html>
