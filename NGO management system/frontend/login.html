<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGO Login</title>


    <style>


        body{

            font-family:Arial, sans-serif;
            background:#f2f2f2;

        }


        .container{

            width:350px;
            margin:100px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;

        }


        h2{

            text-align:center;
            color:green;

        }


        input{

            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;

        }


        button{

            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;

        }


        button:hover{

            background:darkgreen;

        }


        #message{

            text-align:center;
            margin-top:15px;
            font-weight:bold;

        }


        a{

            display:block;
            text-align:center;
            margin-top:15px;

        }


    </style>


</head>



<body>



<div class="container">


    <h2>NGO Login</h2>



    <input
        type="email"
        id="email"
        placeholder="Enter Email"
    >



    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >



    <button onclick="login()">

        Login

    </button>



    <p id="message"></p>



    <a href="signup.html">

        Create New Account

    </a>


</div>




<script>



async function login(){


    const email =
    document.getElementById("email").value;



    const password =
    document.getElementById("password").value;



    try{


        const response = await fetch(

            "http://localhost:5000/api/auth/login",

            {

                method:"POST",


                headers:{

                    "Content-Type":"application/json"

                },


                body:JSON.stringify({

                    email:email,
                    password:password

                })

            }

        );



        const data = await response.json();



        document.getElementById("message").innerHTML =
        data.message;



        if(data.message === "Login successful"){


            localStorage.setItem(
                "username",
                data.name
            );


            setTimeout(()=>{

                window.location.href="dashboard.html";

            },1000);


        }



    }


    catch(error){


        document.getElementById("message").innerHTML =
        "Backend connection failed";


        console.log(error);


    }



}



</script>



</body>


</html>
