<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation Bar -->

<div class="navbar">

    <h2>NGO Management System</h2>

    <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="donations.html">Donations</a></li>
        <li><a href="volunteers.html">Volunteers</a></li>
        <li><a href="beneficiaries.html">Beneficiaries</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="reports.html">Reports</a></li>
    </ul>

</div>

<div class="container">

    <h1>Event Management</h1>

    <form id="eventForm">

        <label>Event Name</label>
        <input type="text" id="eventName" placeholder="Enter Event Name" required>

        <label>Event Date</label>
        <input type="date" id="eventDate" required>

        <label>Location</label>
        <input type="text" id="location" placeholder="Enter Location" required>

        <label>Description</label>
        <textarea id="description" rows="4" placeholder="Enter Event Description" required></textarea>

        <button type="submit">Add Event</button>

    </form>

    <br>

    <input
        type="text"
        id="searchEvent"
        placeholder="Search Event..."
        onkeyup="searchEvent()">

    <br><br>

    <h2>Event List</h2>

    <table id="eventTable">

        <thead>

            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Location</th>
                <th>Description</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

    <br>

    <button onclick="window.location.href='dashboard.html'">
        ← Back to Dashboard
    </button>

</div>

<script src="js/events.js"></script>

</body>
</html>
